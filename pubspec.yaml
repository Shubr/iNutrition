name: inutrition
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.9
  loading_animation_widget: ^1.2.1  # Added missing version
  cupertino_icons: ^1.0.6
  intl: ^0.20.2

  # Firebase dependencies - using versions that work well with AGP 8.3.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  firebase_database: ^10.4.9
  cloud_firestore: ^4.15.8

  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.6
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  assets:
    - assets/icons/backicon.svg
    - assets/icons/barcodeicon.svg
    - assets/icons/bellicon.svg
    - assets/icons/crossicon.svg
    - assets/icons/donuticon.svg
    - assets/icons/editicon.svg
    - assets/icons/homeicon.svg
    - assets/icons/searchicon.svg
    - assets/icons/settingicon.svg
    - assets/icons/splashscreenlogo.svg
    - assets/icons/statsicon.svg

  uses-material-design: true

  fonts:
    - family: Carter
      fonts:
        - asset: assets/fonts/Carter_One/Carter.ttf
          weight: 100
    - family: Afacad
      fonts:
        - asset: assets/fonts/Afacad/Afacad.ttf
    - family: Alex
      fonts:
        - asset: assets/fonts/Alex/Alex_reg.ttf
        - asset: assets/fonts/Alex/Alex_bold.ttf
          weight: 600

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/SplashScreenLogo(1).png
  android: true
  ios: true
  web: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/icon.png"